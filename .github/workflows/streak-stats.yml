name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # chạy mỗi ngày lúc 10h sáng giờ VN
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: # chạy tay từ tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&timezone=Asia/Ho_Chi_Minh&locale=en&mode=daily&theme=dracula&hide_border=false&border_radius=5&order=3
          path: profile/streak.svg
          token: ${{ secrets.github-readme-streak-stats-tstv }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
